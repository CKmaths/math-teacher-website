<!-- =========================
     EXERCISE GENERATOR
========================= -->
<section id="exercises"
         class="section section-light">
<div class="section-heading">
<p class="section-label">
            PRACTICE
        </p>
<h2
            data-km="📝 ម៉ាស៊ីនបង្កើតលំហាត់"
            data-en="📝 Exercise Generator">
📝 ម៉ាស៊ីនបង្កើតលំហាត់
</h2>
<p
            data-km="បង្កើតលំហាត់គណិតវិទ្យាថ្មីៗដោយស្វ័យប្រវត្តិ"
            data-en="Generate new mathematics questions automatically">
បង្កើតលំហាត់គណិតវិទ្យាថ្មីៗដោយស្វ័យប្រវត្តិ
</p>
</div>
<div class="generator-card">
<!-- Settings -->
<div class="generator-settings">
<div class="setting-group">
<label
                    data-km="ប្រធានបទ"
                    data-en="Topic">
ប្រធានបទ
</label>
<select id="topicSelect">
<option value="addition">
                        Addition
                    </option>
<option value="subtraction">
                        Subtraction
                    </option>
<option value="multiplication">
                        Multiplication
                    </option>
<option value="division">
                        Division
                    </option>
<option value="algebra">
                        Algebra
                    </option>
</select>
</div>
<div class="setting-group">
<label
                    data-km="កម្រិត"
                    data-en="Difficulty">
កម្រិត
</label>
<select id="difficultySelect">
<option value="easy">
                        ⭐ Easy
                    </option>
<option value="medium">
                        ⭐⭐ Medium
                    </option>
<option value="hard">
                        ⭐⭐⭐ Hard
                    </option>
</select>
</div>
<button
                id="generateButton"
                class="btn btn-primary">
🔄
                <span
                    data-km="បង្កើតលំហាត់"
                    data-en="Generate Question">
បង្កើតលំហាត់
</span>
</button>
</div>
<!-- Question -->
<div class="question-area">
<span class="question-number"
                  id="questionNumber">
Question 1
</span>
<h3
                data-km="សំណួរ"
                data-en="Question">
សំណួរ
</h3>
<div id="question"
                 class="generated-question">
ចុច "បង្កើតលំហាត់"
                ដើម្បីចាប់ផ្តើម
</div>
<!-- Hint -->
<button
                id="hintButton"
                class="small-button">
💡
                <span
                    data-km="បង្ហាញ Hint"
                    data-en="Show Hint">
បង្ហាញ Hint
</span>
</button>
<p id="hint"
               class="hint">
            </p>
<!-- Answer Input -->
<div class="answer-input">
<label
                    data-km="បញ្ចូលចម្លើយ"
                    data-en="Enter your answer">
បញ្ចូលចម្លើយ
</label>
<input
                    type="number"
                    id="userAnswer"
                    placeholder="Answer">
</div>
<div class="answer-buttons">
<button
                    id="checkButton"
                    class="btn btn-primary">
✅
                    <span
                        data-km="ពិនិត្យចម្លើយ"
                        data-en="Check Answer">
ពិនិត្យចម្លើយ
</span>
</button>
<button
                    id="showAnswerButton"
                    class="btn btn-secondary">
👁️
                    <span
                        data-km="មើលចម្លើយ"
                        data-en="Show Answer">
មើលចម្លើយ
</span>
</button>
</div>
<div id="feedback"
                 class="feedback">
            </div>
</div>
<!-- Score -->
<div class="score-board">
<div>
                <strong id="score">
                    0
                </strong>
<span
                    data-km="ពិន្ទុ"
                    data-en="Score">
ពិន្ទុ
</span>
            </div>
<div>
                <strong id="totalQuestions">
                    0
                </strong>
<span
                    data-km="លំហាត់"
                    data-en="Questions">
លំហាត់
</span>
            </div>
<div>
                <strong id="correctAnswers">
                    0
                </strong>
<span
                    data-km="ត្រូវ"
                    data-en="Correct">
ត្រូវ
</span>
            </div>
</div>
</div>
</section>
